name: nasaq
description: نَقا - Smart Offline Device Organizer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  # إدارة الحالة
  flutter_riverpod: ^2.3.6
  # الوصول للمكتبة الإعلامية
  photo_manager: ^2.7.0
  # الأذونات
  permission_handler: ^11.0.1
  # مقارنة الصور (hashing)
  image: ^4.0.17
  # حركات محسّنة (اختياري للسهولة)
  flutter_animate: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700